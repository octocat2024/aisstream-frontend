name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
    build:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: gps-project
        steps:
            - uses: actions/checkout@v3
            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '22'
                  cache: 'npm'
                  cache-dependency-path: gps-project/package-lock.json
            - name: Install dependencies
              run: npm ci
            - name: Lint
              run: npm run lint
            - name: Build
              run: npm run build

    frontend-docker:
        environment: "ais environment"
        if: >-
            (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
            github.event_name == 'workflow_dispatch'
        runs-on: ubuntu-latest
        needs: build
        steps:
            - name: Check secrets (safe debug)
              run: |
                echo "Username set: ${{ secrets.DOCKER_USERNAME != '' }}"
                echo "Password set: ${{ secrets.DOCKER_SECRET != '' }}"
            - uses: actions/checkout@v3
            - name: Login to Docker Hub
              uses: docker/login-action@v3
              with:
                  username: ${{ secrets.DOCKER_USERNAME }}
                  password: ${{ secrets.DOCKER_SECRET }}
            - name: Build and push Docker image
              uses: docker/build-push-action@v3
              with:
                  context: gps-project
                  file: gps-project/Dockerfile
                  push: true
                  tags: ${{ secrets.DOCKER_USERNAME }}/aisstream-frontend:${{ github.run_number }}